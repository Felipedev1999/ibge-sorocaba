<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel 12 Eixos</title>
  <meta name="description" content="Painel de posicionamento político do grupo nos 12 eixos. Dados locais; nada sai do navegador.">
  <script>
    // Aplica o tema antes do primeiro desenho para evitar piscar.
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <nav class="viewnav" id="tabs" role="tablist" aria-label="Views"></nav>

  <div class="layout">
    <main id="main">
      <div id="problems"></div>
      <div id="chips" aria-live="polite"></div>
      <section id="view"></section>
    </main>
    <aside class="rail" id="rail" aria-label="Resumo e navegação"></aside>
  </div>

  <footer class="footer">
    <div class="logo">12 <span>eixos</span> · painel do grupo</div>
    <p>Desenvolvido por <strong>Felipe Oliveira</strong> · Dados locais. Nada sai do navegador além das bibliotecas carregadas por CDN.</p>
  </footer>

  <aside class="drawer" id="sidebar" aria-label="Filtros de pessoas"></aside>
  <div class="scrim" id="scrim"></div>

  <!-- Biblioteca de gráficos (única dependência externa além das fontes) -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>

  <!-- Dados do grupo: o único arquivo a editar para adicionar pessoas/anos -->
  <script src="data/data.js"></script>

  <script src="js/auth.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/avatars.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
